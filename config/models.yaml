# Z.AI GLM models over the OpenAI-compatible endpoint (https://api.z.ai/api/paas/v4).
# Create a key at https://z.ai and set ZAI_API_KEY in .env. This is a PAID API: every call
# below is billed, and reasoning tokens are billed as output. The `thinking` flag and the
# per-role `effort` exist to keep that bill proportionate to the job.
provider: zai

# IMPORTANT - only use ids this plan actually serves. Probed 2026-11-15: this account serves
# exactly TWO models and silently aliases the rest, so a config naming glm-4.6/4.7/5.1/5.2 is a
# trap -- it looks like a four-model setup and is really a two-model one.
#
#     requested glm-5.3 / glm-5.2 / glm-5.1 / glm-5          -> served  glm-5.3
#     requested glm-4.7 / glm-4.6 / glm-4.5-air              -> served  glm-5.3-flash
#
# ZaiLLM warns on stderr whenever the served model differs from the requested one.
#
# Per-role selection (task-model fit), using the two real ids:
#
#   manager   - routing only (two or three legal transitions). Cheapest model, lowest effort.
#   diagnoser - multi-step ReAct over traces and code: the hardest reasoning -> flagship.
#   fixer     - code generation from an already-localised diagnosis -> flagship.
#   judge     - LLM-as-judge. MUST differ from BOTH generators (self-preference bias), enforced
#               at load time in codefix/config.py. With two served models that forces the judge
#               onto the other one -- which is exactly the independence the method needs.
#
# Both served models use FORCED thinking (it cannot be disabled), so reasoning tokens are always
# billed as output and `effort` is the only cost lever. Both accept only low/high/max; anything
# else is normalised to the nearest supported level by ZaiLLM.normalize_effort.
roles:
  manager:
    model: glm-5.3-flash
    effort: low
    max_tokens: 2048
  diagnoser:
    model: glm-5.3
    effort: high
    max_tokens: 16000
  fixer:
    model: glm-5.3
    effort: high
    max_tokens: 16000
  judge:
    model: glm-5.3-flash
    effort: low
    max_tokens: 8000

# USD per 1M text tokens. Source: Z.AI pricing page, read 2026-11-15. `cache_read` is the
# cached-input rate; Z.AI currently advertises cached-input storage as free, so cache_write is 0.
#
# glm-5.3-flash MUST have its own row. cost_usd() falls back to a prefix match for unknown
# models, and "glm-5.3-flash".startswith("glm-5.3") -- so without this row every flash call
# would be billed at the flagship's rate, roughly 9x too high.
pricing:
  glm-5.3-flash:     {input: 0.15, output: 0.50, cache_read: 0.03}
  glm-5.3:           {input: 1.40, output: 4.40, cache_read: 0.26}
  glm-5.2:           {input: 1.40, output: 4.40, cache_read: 0.26}
  glm-5.1:           {input: 1.40, output: 4.40, cache_read: 0.26}
  glm-5:             {input: 1.00, output: 3.20, cache_read: 0.20}
  glm-4.7:           {input: 0.60, output: 2.20, cache_read: 0.11}
  glm-4.6:           {input: 0.60, output: 2.20, cache_read: 0.11}
  claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-opus-5:     {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-4-8:   {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-fable-5-1:  {input: 10.0, output: 50.00, cache_read: 0.25, cache_write: 12.50}
  claude-sonnet-5:   {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  mock:              {input: 0.0,  output: 0.0,   cache_read: 0.0,  cache_write: 0.0}

# Counterfactual list prices for the benchmark report's "what would this cost on one model"
# estimate — i.e. the same token volume if every agent ran on a single model instead of the
# per-role mix above. Same source and date as `pricing`.
estimate_pricing:
  glm-5.3 (all agents):       {input: 1.40, output: 4.40, cache_read: 0.26}
  glm-5.3-flash (all agents): {input: 0.15, output: 0.50, cache_read: 0.03}

pipeline:
  max_attempts: 3            # Fixer attempts before escalating to a human
  react_max_iterations: 8    # Diagnoser ReAct cap; degrades to best-effort diagnosis
  max_rediagnoses: 1         # Manager may ask for one re-diagnosis on a weak diagnosis
  rediagnose_below_confidence: 0.35
  test_timeout_s: 180
  allow_test_edits: false    # patches that modify test files are rejected
  rag_k: 6
  prompt_variant: react      # react | fewshot | react-reflect   (override per run: --variant)
  persona: default           # default | senior | novice | security (override per run: --persona)
